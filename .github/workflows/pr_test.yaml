name: Test for pull requests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run biome check
        run: pnpm lint
      - name: Check protobuf generated files are up to date
        run: |
          pnpm proto
          if [ -n "$(git status --porcelain packages/shared/src/models)" ]; then
            echo "::error::Generated protobuf files are out of date. Run 'pnpm proto' locally and commit the result."
            git status --porcelain packages/shared/src/models
            git --no-pager diff -- packages/shared/src/models
            exit 1
          fi
      - name: Build packages
        run: pnpm build
      - name: Run unit tests
        run: pnpm test
      - name: Run desktop smoke test
        run: pnpm --filter @sola_mpd/desktop test:e2e
      - name: Test building docker container
        run: docker compose create
