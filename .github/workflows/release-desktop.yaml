name: Release Desktop

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        required: true
        type: string
        description: Existing release tag (e.g. v4.4.0) to attach desktop assets to

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @sola_mpd/shared build:no_types

      - name: Build frontend
        run: pnpm --filter @sola_mpd/frontend build:no_types

      - name: Build desktop
        run: pnpm --filter @sola_mpd/desktop build:no_types

      - name: Install xvfb and mpd (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb mpd

      - name: Package desktop app
        run: pnpm --filter @sola_mpd/desktop dist

      - name: Smoke test packaged desktop app
        uses: ./.github/actions/smoke-test-desktop
        with:
          platform: ${{ matrix.platform }}
          require-mpd: ${{ matrix.platform == 'linux' && '1' || '0' }}

      - name: Upload desktop E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-e2e-${{ matrix.platform }}
          path: packages/desktop/test-results
          if-no-files-found: ignore

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          files: |
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.dmg
            packages/desktop/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
