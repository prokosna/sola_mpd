syntax = "proto3";

message MpdProfile {
  string name = 1;
  string host = 2;
  uint32 port = 3;
  string password = 4;
}

// current_profile is the workspace-wide default profile. Per-device selection
// lives in device settings, not here.
message MpdProfileState {
  MpdProfile current_profile = 1;
  repeated MpdProfile profiles = 2;
  uint32 schema_version = 3;
}
