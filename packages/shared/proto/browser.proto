syntax = "proto3";

import "song.proto";

message BrowserFilter {
  Song.MetadataTag tag = 1;
  repeated Song.MetadataValue selected_values = 2 [deprecated = true];
  int32 order = 3 [deprecated = true];
  int32 selected_order = 4 [deprecated = true];
}

message BrowserState {
  repeated BrowserFilter filters = 1 [deprecated = true];
  uint32 schema_version = 2;
  repeated Song.MetadataTag filter_tags = 3;
}
